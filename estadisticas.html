<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de Capacitación ITD - Nuevo Sitio Oficial</title>

  <!-- Redirección automática inmediata (0 segundos) -->
  <meta http-equiv="refresh" content="0; url=https://inscripciones-itd.vercel.app" />

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1b396a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .card {
      background: white;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 440px;
      margin: 1rem;
    }
    .logos {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .logos img { height: 46px; object-fit: contain; }
    h2 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { font-size: 0.9rem; color: #64748b; margin-bottom: 1.5rem; }
    .btn {
      display: inline-block;
      background: #1b396a;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 600;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e2e8f0;
      border-top-color: #1b396a;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    // Redirección inmediata por JavaScript
    window.location.replace("https://inscripciones-itd.vercel.app");
  </script>
</head>
<body>
  <div class="card">
    <div class="logos">
      <img src="https://raw.githubusercontent.com/DA-itd/E/main/LOGO_tecnm.jpg" alt="TecNM" />
      <img src="https://raw.githubusercontent.com/DA-itd/E/main/logo_itdurango.png" alt="ITD" />
    </div>
    <div class="spinner"></div>
    <h2>Redirigiendo al Nuevo Portal Oficial</h2>
    <p>Este enlace ha sido actualizado al nuevo sistema institucional de capacitación docente.</p>
    <a href="https://inscripciones-itd.vercel.app" class="btn">Ir al nuevo portal ahora &rarr;</a>
  </div>
</body>
</html>
